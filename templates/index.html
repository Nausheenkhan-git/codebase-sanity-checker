<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebase Sanity Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2.8em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .input-section {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s;
            min-width: 250px;
        }
        
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 16px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .examples {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .examples-label {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }
        
        .example-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .example-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
            color: #fff;
            transform: translateY(-1px);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 60px 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading p {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .loading .sub-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }
        
        .results-section {
            display: none;
            margin-top: 30px;
        }
        
        .results-section.active {
            display: block;
        }
        
        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .score-number {
            font-size: 5em;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .score-label {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .score-status {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 15px;
            font-size: 1.1em;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-passed {
            background: rgba(40, 167, 69, 0.3);
            color: #51cf66;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        
        .status-failed {
            background: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .status-skipped {
            background: rgba(255, 193, 7, 0.3);
            color: #ffd43b;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .breakdown-item {
            background: rgba(255, 255, 255, 0.06);
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        
        .breakdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .breakdown-item .label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }
        
        .breakdown-item .value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        
        .breakdown-item .value .max {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7em;
        }
        
        .section-title {
            color: #fff;
            font-size: 1.3em;
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .recommendations {
            background: rgba(255, 193, 7, 0.1);
            border-left: 4px solid #ffd43b;
            padding: 20px 25px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .recommendations h3 {
            color: #ffd43b;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .recommendations ul {
            list-style: none;
            padding: 0;
        }
        
        .recommendations li {
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .recommendations li:last-child {
            border-bottom: none;
        }
        
        .report-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            max-height: 450px;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .report-section pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
        }
        
        .report-section::-webkit-scrollbar {
            width: 8px;
        }
        
        .report-section::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .report-section::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }
        
        .report-section::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.8);
        }
        
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .error {
            background: rgba(220, 53, 69, 0.15);
            border-left: 4px solid #dc3545;
            padding: 20px 25px;
            border-radius: 8px;
            color: #ff6b6b;
            margin: 20px 0;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item .stat-value {
            color: #fff;
            font-size: 1.4em;
            font-weight: bold;
        }
        
        .stat-item .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8em;
            margin-top: 4px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 16px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            .score-number {
                font-size: 3.5em;
            }
            
            .breakdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .breakdown {
                grid-template-columns: 1fr;
            }
            
            .score-status {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Codebase Sanity Checker</h1>
        <p class="subtitle">Agentic workflow for automated codebase health assessment</p>
        
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="repoUrl" placeholder="Enter GitHub repository URL (e.g., https://github.com/psf/requests.git)" />
                <button id="analyzeBtn" onclick="startAnalysis()">🔍 Analyze Repository</button>
            </div>
            <div class="examples">
                <span class="examples-label">Quick examples:</span>
                <button class="example-btn" onclick="setExample('https://github.com/psf/requests.git')">requests</button>
                <button class="example-btn" onclick="setExample('https://github.com/realpython/python-guide.git')">python-guide</button>
                <button class="example-btn" onclick="setExample('https://github.com/pallets/flask.git')">flask</button>
                <button class="example-btn" onclick="setExample('https://github.com/django/django.git')">django</button>
            </div>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>🔍 Analyzing repository...</p>
            <p class="sub-text">Running tests, checking linting, and generating report</p>
        </div>
        
        <div id="results" class="results-section">
            <div id="scoreCard"></div>
            <div id="breakdown"></div>
            <div id="recommendations"></div>
            <div id="reportSection"></div>
            <div class="actions">
                <button onclick="downloadReport()">📥 Download Report</button>
                <button class="btn-secondary" onclick="resetAnalysis()">🔄 New Analysis</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentTaskId = null;
        
        function setExample(url) {
            document.getElementById('repoUrl').value = url;
        }
        
        function startAnalysis() {
            const repoUrl = document.getElementById('repoUrl').value.trim();
            if (!repoUrl) {
                alert('Please enter a repository URL');
                return;
            }
            
            // Validate URL
            if (!repoUrl.startsWith('https://github.com/')) {
                alert('Please enter a valid GitHub repository URL');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('analyzeBtn').disabled = true;
            
            // Send request
            fetch('/api/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ repo_url: repoUrl })
            })
            .then(response => response.json())
            .then(data => {
                if (data.task_id) {
                    currentTaskId = data.task_id;
                    checkStatus(currentTaskId);
                } else {
                    showError('Failed to start analysis');
                }
            })
            .catch(error => {
                showError('Network error: ' + error.message);
            });
        }
        
        function checkStatus(taskId) {
            fetch(`/api/status/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'complete') {
                        showResults(data);
                    } else if (data.status === 'error') {
                        showError(data.error || 'Analysis failed');
                    } else {
                        // Still processing
                        setTimeout(() => checkStatus(taskId), 2000);
                    }
                })
                .catch(error => {
                    setTimeout(() => checkStatus(taskId), 2000);
                });
        }
        
        function showResults(data) {
            // Hide loading
            document.getElementById('loading').classList.remove('active');
            document.getElementById('analyzeBtn').disabled = false;
            
            const results = data.results;
            const score = data.score;
            const recommendations = data.recommendations;
            const report = data.report;
            
            // Show results
            document.getElementById('results').classList.add('active');
            
            // Get test status for badge
            const testStatus = results.tests?.status || 'Unknown';
            const statusBadge = getStatusBadge(testStatus);
            
            // Score card
            document.getElementById('scoreCard').innerHTML = `
                <div class="score-card">
                    <div class="score-label">Quality Score</div>
                    <div class="score-number">${score}/100</div>
                    <div class="score-status">
                        <span>${score >= 70 ? '✅ Excellent' : score >= 50 ? '🟡 Needs Improvement' : '🔴 Needs Work'}</span>
                        <span>Tests: ${statusBadge}</span>
                    </div>
                </div>
            `;
            
            // Stats row
            const testScore = extractScore(report, 'Tests');
            const lintScore = extractScore(report, 'Linting');
            const structScore = extractScore(report, 'Structure');
            const depScore = extractScore(report, 'Dependencies');
            
            // Breakdown
            document.getElementById('breakdown').innerHTML = `
                <div class="section-title">📊 Score Breakdown</div>
                <div class="breakdown">
                    <div class="breakdown-item">
                        <div class="label">🧪 Tests</div>
                        <div class="value">${testScore}<span class="max">/30</span></div>
                    </div>
                    <div class="breakdown-item">
                        <div class="label">🔍 Linting</div>
                        <div class="value">${lintScore}<span class="max">/30</span></div>
                    </div>
                    <div class="breakdown-item">
                        <div class="label">📁 Structure</div>
                        <div class="value">${structScore}<span class="max">/20</span></div>
                    </div>
                    <div class="breakdown-item">
                        <div class="label">📦 Dependencies</div>
                        <div class="value">${depScore}<span class="max">/20</span></div>
                    </div>
                </div>
            `;
            
            // Recommendations
            const recs = recommendations.split('\n').filter(line => line.trim());
            document.getElementById('recommendations').innerHTML = `
                <div class="recommendations">
                    <h3>💡 Recommendations</h3>
                    <ul>
                        ${recs.map(line => `<li>${line}</li>`).join('')}
                    </ul>
                </div>
            `;
            
            // Report
            document.getElementById('reportSection').innerHTML = `
                <div class="section-title">📄 Complete Report</div>
                <div class="report-section">
                    <pre>${escapeHtml(report)}</pre>
                </div>
            `;
            
            // Scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }
        
        function getStatusBadge(status) {
            const badges = {
                'passed': '<span class="status-badge status-passed">✅ Passed</span>',
                'failed': '<span class="status-badge status-failed">❌ Failed</span>',
                'skipped': '<span class="status-badge status-skipped">⏭️ Skipped</span>'
            };
            return badges[status] || `<span class="status-badge">${status}</span>`;
        }
        
        function extractScore(report, component) {
            const lines = report.split('\n');
            for (let line of lines) {
                const match = line.match(new RegExp(`${component}\\s*:\\s*(\\d+)/(\\d+)`));
                if (match) {
                    return match[1];
                }
            }
            return '0';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showError(message) {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('analyzeBtn').disabled = false;
            
            document.getElementById('results').classList.add('active');
            document.getElementById('scoreCard').innerHTML = `
                <div class="error">
                    ❌ Error: ${message}
                </div>
            `;
        }
        
        function downloadReport() {
            if (currentTaskId) {
                window.location.href = `/api/download/${currentTaskId}`;
            }
        }
        
        function resetAnalysis() {
            document.getElementById('results').classList.remove('active');
            document.getElementById('repoUrl').value = '';
            document.getElementById('scoreCard').innerHTML = '';
            document.getElementById('breakdown').innerHTML = '';
            document.getElementById('recommendations').innerHTML = '';
            document.getElementById('reportSection').innerHTML = '';
            currentTaskId = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Enter key support
        document.getElementById('repoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startAnalysis();
            }
        });
    </script>
</body>
</html>
